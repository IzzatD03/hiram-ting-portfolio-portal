name: Validate and Build Website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "content/**"
      - "public/uploads/**"
      - "app/**"
      - "components/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content and build
        run: npm run check
